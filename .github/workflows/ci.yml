name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  test:
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version-file: "backend/.python-version"

      - name: Cache pip dependencies
        if: needs.changes.outputs.backend == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            pip-

      - name: Install dependencies
        if: needs.changes.outputs.backend == 'true'
        run: pip install -r backend/requirements.txt

      - name: Lint with ruff
        if: needs.changes.outputs.backend == 'true'
        run: ruff check backend/

      - name: Check formatting with ruff
        if: needs.changes.outputs.backend == 'true'
        run: ruff format --check backend/

      - name: Run tests
        if: needs.changes.outputs.backend == 'true'
        run: pytest --cov=backend --cov-report=term backend/tests/ -v

  build-backend:
    runs-on: ubuntu-latest
    needs: [changes, test]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: needs.changes.outputs.backend == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: travel-agent-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        if: needs.changes.outputs.backend == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: travel-agent-backend:ci
          format: sarif
          output: trivy-backend.sarif
          exit-code: "0"

      - name: Upload Trivy scan results
        if: needs.changes.outputs.backend == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

  frontend:
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Test
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm test

      - name: Build
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run build

  build-frontend:
    runs-on: ubuntu-latest
    needs: [changes, frontend]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: travel-agent-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        if: needs.changes.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: travel-agent-frontend:ci
          format: sarif
          output: trivy-frontend.sarif
          exit-code: "0"

      - name: Upload Trivy scan results
        if: needs.changes.outputs.frontend == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
