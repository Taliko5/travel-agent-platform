# CI pipeline: lint/test/build backend & frontend independently,
# skip a stack's steps when its path didn't change, always scan for secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # supersede older in-flight runs on the same branch
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detect whether this push/PR touched backend/ or frontend/,
  # so downstream jobs can skip irrelevant work.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      helm: ${{ steps.filter.outputs.helm }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            helm:
              - 'Infrastructure/helm/**'

      - name: Report detected changes
        run: |
          echo "backend changed: ${{ steps.filter.outputs.backend }}"
          echo "frontend changed: ${{ steps.filter.outputs.frontend }}"
          echo "helm changed: ${{ steps.filter.outputs.helm }}"

  test:
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Report path-filter result
        run: |
          if [ "${{ needs.changes.outputs.backend }}" == "true" ]; then
            echo "backend/ changed — running lint, format check, and tests"
          else
            echo "backend/ unchanged — skipping steps below, reporting success as a no-op required check"
          fi

      - name: Set up Python
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version-file: 'backend/.python-version'

      - name: Cache pip dependencies
        if: needs.changes.outputs.backend == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            pip-

      - name: Install dependencies
        if: needs.changes.outputs.backend == 'true'
        run: pip install -r backend/requirements.txt

      - name: Lint with ruff
        if: needs.changes.outputs.backend == 'true'
        run: ruff check backend/

      - name: Check formatting with ruff
        if: needs.changes.outputs.backend == 'true'
        run: ruff format --check backend/

      - name: Run tests
        if: needs.changes.outputs.backend == 'true'
        run: pytest --cov=backend --cov-report=term backend/tests/ -v

  build-backend:
    runs-on: ubuntu-latest
    needs: [changes, test]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Report path-filter result
        run: |
          if [ "${{ needs.changes.outputs.backend }}" == "true" ]; then
            echo "backend/ changed — building the Docker image and scanning it"
          else
            echo "backend/ unchanged — skipping steps below, reporting success as a no-op required check"
          fi

      - name: Set up Docker Buildx
        if: needs.changes.outputs.backend == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: travel-agent-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        if: needs.changes.outputs.backend == 'true'
        # pin: v1 not yet released as of 2026-07
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: travel-agent-backend:ci
          format: sarif
          output: trivy-backend.sarif
          exit-code: '0'

      - name: Upload Trivy scan results
        if: needs.changes.outputs.backend == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

  frontend:
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Report path-filter result
        run: |
          if [ "${{ needs.changes.outputs.frontend }}" == "true" ]; then
            echo "frontend/ changed — installing deps, linting, testing, and building"
          else
            echo "frontend/ unchanged — skipping steps below, reporting success as a no-op required check"
          fi

      - name: Set up Node.js
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Test
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm test

      - name: Build
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run build

  build-frontend:
    runs-on: ubuntu-latest
    needs: [changes, frontend]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Report path-filter result
        run: |
          if [ "${{ needs.changes.outputs.frontend }}" == "true" ]; then
            echo "frontend/ changed — building the Docker image and scanning it"
          else
            echo "frontend/ unchanged — skipping steps below, reporting success as a no-op required check"
          fi

      - name: Set up Docker Buildx
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: travel-agent-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        if: needs.changes.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: travel-agent-frontend:ci
          format: sarif
          output: trivy-frontend.sarif
          exit-code: '0'

      - name: Upload Trivy scan results
        if: needs.changes.outputs.frontend == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  chart-lint:
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Report path-filter result
        run: |
          if [ "${{ needs.changes.outputs.helm }}" == "true" ]; then
            echo "Infrastructure/helm/ changed — rendering and dry-run validating the chart"
          else
            echo "Infrastructure/helm/ unchanged — skipping steps below, reporting success as a no-op required check"
          fi

      - name: Set up Helm
        if: needs.changes.outputs.helm == 'true'
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        if: needs.changes.outputs.helm == 'true'
        uses: azure/setup-kubectl@v4

      - name: Create throwaway kind cluster
        if: needs.changes.outputs.helm == 'true'
        uses: helm/kind-action@v1.15.0
        with:
          cluster_name: chart-lint

      - name: Install Gateway API CRDs
        if: needs.changes.outputs.helm == 'true'
        run: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/standard-install.yaml

      - name: Install Secrets Store CSI Driver CRDs
        if: needs.changes.outputs.helm == 'true'
        run: kubectl apply -f https://raw.githubusercontent.com/kubernetes-sigs/secrets-store-csi-driver/main/charts/secrets-store-csi-driver/crds/secrets-store.csi.x-k8s.io_secretproviderclasses.yaml

      - name: Render and dry-run validate the chart
        if: needs.changes.outputs.helm == 'true'
        run: |
          helm template travel-agent Infrastructure/helm/travel-agent \
            -f Infrastructure/helm/travel-agent/values-example.yaml \
            | kubectl apply --dry-run=client -f -

  push:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

      - name: Read gateway hostname from values.yaml
        id: gateway-host
        run: |
          echo "backend_host=$(yq '.gateway.backendHost' Infrastructure/helm/travel-agent/values.yaml)" >> "$GITHUB_OUTPUT"
          echo "frontend_host=$(yq '.gateway.frontendHost' Infrastructure/helm/travel-agent/values.yaml)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/travel-agent-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ steps.gateway-host.outputs.backend_host }}
          tags: ${{ vars.ACR_LOGIN_SERVER }}/travel-agent-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group "${{ vars.AKS_RESOURCE_GROUP_NAME }}" --name "${{ vars.AKS_CLUSTER_NAME }}" --overwrite-existing

      - name: Convert kubeconfig to use kubelogin
        run: kubelogin convert-kubeconfig -l azurecli

      - name: Deploy with Helm
        run: |
          helm upgrade --install travel-agent Infrastructure/helm/travel-agent \
            --set image.backend.repository="${{ vars.ACR_LOGIN_SERVER }}/travel-agent-backend" \
            --set image.backend.tag="${{ github.sha }}" \
            --set image.frontend.repository="${{ vars.ACR_LOGIN_SERVER }}/travel-agent-frontend" \
            --set image.frontend.tag="${{ github.sha }}" \
            --set frontend.apiUrl="http://${{ steps.gateway-host.outputs.backend_host }}" \
            --set backend.corsAllowedOrigins="http://${{ steps.gateway-host.outputs.frontend_host }}" \
            --set serviceAccount.workloadIdentityClientId="${{ vars.BACKEND_IDENTITY_CLIENT_ID }}" \
            --set keyVault.name="${{ vars.KEY_VAULT_NAME }}" \
            --set keyVault.tenantId="${{ vars.AZURE_TENANT_ID }}"
