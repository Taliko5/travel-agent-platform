# A representative override set, shaped like what CI's `push` job (D4, D13)
# actually supplies at deploy time — a commit SHA image tag, the ACR login
# server as the repository prefix, and the Terraform outputs for identity
# and vault. Values here are placeholders, not real Azure identifiers; this
# file exists for `helm template`/`helm lint` (task 3.12), not for `helm
# install`.

image:
  backend:
    repository: exampleacr.azurecr.io/travel-agent-backend
    tag: a1b2c3d4e5f6
  frontend:
    repository: exampleacr.azurecr.io/travel-agent-frontend
    tag: a1b2c3d4e5f6

backend:
  corsAllowedOrigins: "http://travel-agent.internal"

frontend:
  apiUrl: "http://api.travel-agent.internal"

serviceAccount:
  workloadIdentityClientId: "00000000-0000-0000-0000-000000000000"

keyVault:
  name: "example-kv"
  tenantId: "11111111-1111-1111-1111-111111111111"
