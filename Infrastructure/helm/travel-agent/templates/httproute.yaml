apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: travel-agent-frontend
spec:
  parentRefs:
    - name: travel-agent-gateway
      sectionName: frontend
  hostnames:
    - {{ .Values.gateway.frontendHost | quote }}
  rules:
    - backendRefs:
        - name: travel-agent-frontend
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: travel-agent-backend
spec:
  parentRefs:
    - name: travel-agent-gateway
      sectionName: backend
  hostnames:
    - {{ .Values.gateway.backendHost | quote }}
  rules:
    - backendRefs:
        - name: travel-agent-backend
          port: 80
