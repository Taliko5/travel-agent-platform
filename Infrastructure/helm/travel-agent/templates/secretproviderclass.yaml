# Workload-identity access mode (D5). Mounting this from a pod is what
# makes the CSI driver sync google-api-key into the k8sSecretName Secret
# below — see backend-deployment.yaml's csi volume mount for the comment
# on why the mount is unread but required (design.md D5, task 1.1).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: travel-agent-secrets-spc
spec:
  provider: azure
  secretObjects:
    - secretName: {{ .Values.keyVault.k8sSecretName }}
      type: Opaque
      data:
        - objectName: {{ .Values.keyVault.secretObjectName }}
          key: {{ .Values.keyVault.secretKey }}
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.serviceAccount.workloadIdentityClientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    cloudName: ""
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.keyVault.secretObjectName }}
          objectType: secret
